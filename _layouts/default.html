<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% seo title=false %}
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
    <link rel="alternate icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/ink.css' | relative_url }}">
</head>
<body>
    {% include nav.html %}

    <main>
        {{ content }} 
    </main>

    {% include footer.html %}

    {% if page.ink_js %}<script src="{{ '/assets/js/ink-plates.js' | relative_url }}"></script>{% endif %}
</body>
</html>
