<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    <!-- Prevent flash of wrong theme -->
    <script>
        (function() {
            const saved = localStorage.getItem('theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    {% include nav.html %}
    
    <main class="{% if page.url == '/' %}main-home{% else %}main-page{% endif %}">
        {{ content }}
    </main>
    
    {% include footer.html %}
    
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', newTheme);
            
            const sunToggle = document.getElementById('sun-toggle');
            const moonToggle = document.getElementById('moon-toggle');
            
            if (newTheme === 'dark') {
                sunToggle.classList.remove('active');
                moonToggle.classList.add('active');
            } else {
                sunToggle.classList.add('active');
                moonToggle.classList.remove('active');
            }
            
            localStorage.setItem('theme', newTheme);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            
            const sunToggle = document.getElementById('sun-toggle');
            const moonToggle = document.getElementById('moon-toggle');
            
            if (savedTheme === 'dark') {
                sunToggle.classList.remove('active');
                moonToggle.classList.add('active');
            }
        });
    </script>
</body>
</html>
